name: hume_mobile

description: Hume mobile app

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.5.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.0
  go_router: ^14.2.7
  flutter_riverpod: ^2.5.1
  dio: ^5.6.0
  freezed_annotation: ^2.5.1
  json_annotation: ^4.9.0
  intl: ^0.19.0
  cached_network_image: ^3.1.1
  flutter_secure_storage: ^9.2.2
  google_maps_flutter: ^2.7.1
  geolocator: ^12.0.0
  image_picker: ^1.0.0
  image_cropper: ^8.0.0
  socket_io_client: ^2.0.0
  flutter_webrtc: ^0.11.5
  firebase_messaging: ^15.1.2
  flutter_local_notifications: ^17.2.2
  local_auth: ^2.0.0
  sign_in_with_apple: ^6.1.1
  google_sign_in: ^6.1.1
  flutter_facebook_auth: ^6.0.0
  in_app_purchase: ^3.1.0
  stripe_checkout: ^1.0.0
  permission_handler: ^11.0.0
  record: ^5.3.0

  dev_dependencies:
    flutter_test:
      sdk: flutter
    flutter_lints: ^4.0.0
    build_runner: ^2.4.0
    freezed: ^2.5.0
    json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
